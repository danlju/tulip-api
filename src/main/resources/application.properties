spring.application.name=tulip
spring.main.allow-bean-definition-overriding=true
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.web.client=DEBUG
#logging.level.root=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Configuration for MySQL Database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tulipdb
spring.datasource.username=tulipdb
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql:true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

sqs.uri=${SQS_ENDPOINT:http://localhost:9324}
sqs.region=${AWS_REGION:us-east-1}
sqs.static-credentials=${SQS_STATIC_CREDENTIALS:true}
sqs.queue-name=tulip-queue
sqs.queue-url=${SQS_QUEUE_URL:${sqs.uri}/${sqs.queue-name}}
internal.worker-token=${TULIP_WORKER_TOKEN:}
